<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Pizza Maker | Assignment 2</title>

  <!-- stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- script -->
  <script src="js/script.js" defer></script>
</head>
<body>

  <header>
    <h1>🍕 The Pizza Maker</h1>
    <p>Build your dream pizza, one topping at a time.</p>
  </header>

  <!-- empty for now -->
  <p id="student-info"></p>

  <main>

    <form id="pizza-form" novalidate>

      <h2>Design Your Pizza</h2>

      <!-- name -->
      <div class="form-group">
        <label for="customer-name">Your Name</label>
        <input type="text" id="customer-name" name="customer-name" placeholder="e.g. Melika" required />
        <span class="error-msg" id="error-name"></span>
      </div>

      <!-- size -->
      <div class="form-group">
        <label for="size">Pizza Size</label>
        <select id="size" name="size" required>
          <option value="">-- Choose a size --</option>
          <option value="Small">Small (10")</option>
          <option value="Medium">Medium (12")</option>
          <option value="Large">Large (14")</option>
          <option value="Extra Large">Extra Large (16")</option>
        </select>
        <span class="error-msg" id="error-size"></span>
      </div>

      <!-- crust -->
      <fieldset class="form-group">
        <legend>Crust Type</legend>
        <label><input type="radio" name="crust" value="Thin & Crispy" required /> Thin &amp; Crispy</label>
        <label><input type="radio" name="crust" value="Hand-Tossed" /> Hand-Tossed</label>
        <label><input type="radio" name="crust" value="Deep Dish" /> Deep Dish</label>
        <label><input type="radio" name="crust" value="Stuffed Crust" /> Stuffed Crust</label>
        <span class="error-msg" id="error-crust"></span>
      </fieldset>

      <!-- sauce -->
      <div class="form-group">
        <label for="sauce">Sauce</label>
        <select id="sauce" name="sauce" required>
          <option value="">-- Choose a sauce --</option>
          <option value="Classic Tomato">Classic Tomato</option>
          <option value="Garlic White">Garlic White Sauce</option>
          <option value="BBQ">BBQ</option>
          <option value="Pesto">Pesto</option>
        </select>
        <span class="error-msg" id="error-sauce"></span>
      </div>

      <!-- cheese slider -->
      <div class="form-group">
        <label for="cheese-range">Cheese Level: <span id="cheese-output">Regular</span></label>
        <input type="range" id="cheese-range" name="cheese-range" min="0" max="3" step="1" value="1" />
      </div>

      <!-- toppings -->
      <fieldset class="form-group">
        <legend>Toppings (choose at least 1)</legend>
        <label><input type="checkbox" name="toppings" value="Pepperoni" /> Pepperoni</label>
        <label><input type="checkbox" name="toppings" value="Mushrooms" /> Mushrooms</label>
        <label><input type="checkbox" name="toppings" value="Onions" /> Onions</label>
        <label><input type="checkbox" name="toppings" value="Pineapple" /> Pineapple</label>
        <label><input type="checkbox" name="toppings" value="Bacon" /> Bacon</label>
        <label><input type="checkbox" name="toppings" value="Extra Cheese" /> Extra Cheese</label>
        <span class="error-msg" id="error-toppings"></span>
      </fieldset>

      <!-- quantity -->
      <div class="form-group">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1" required />
        <span class="error-msg" id="error-quantity"></span>
      </div>

      <!-- delivery or pickup -->
      <div class="form-group">
        <label for="delivery">Delivery or Pickup?</label>
        <select id="delivery" name="delivery" required>
          <option value="">-- Choose one --</option>
          <option value="Delivery">Delivery</option>
          <option value="Pickup">Pickup</option>
        </select>
        <span class="error-msg" id="error-delivery"></span>
      </div>

      <!-- notes, optional -->
      <div class="form-group">
        <label for="notes">Special Instructions (optional)</label>
        <textarea id="notes" name="notes" rows="3" placeholder="e.g. extra crispy, cut into squares..."></textarea>
      </div>

      <button type="submit" id="order-btn">Order My Pizza 🍕</button>

    </form>

    <!-- hidden until order is submitted -->
    <section id="order-output" class="hidden">
      <h2>Your Order Summary</h2>
      <p id="order-summary"></p>
    </section>

  </main>

</body>
</html>
